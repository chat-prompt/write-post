  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: VERSION must change when skill files change
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD~1 HEAD -- .claude/skills/write-post | grep -v '/VERSION$' || true)
            vchanged=$(git diff --name-only HEAD~1 HEAD -- .claude/skills/write-post/VERSION || true)
            if [ -n "$changed" ] && [ -z "$vchanged" ]; then echo "skill files changed but VERSION not bumped:"; echo "$changed"; exit 1; fi
          fi
          echo "VERSION: $(cat .claude/skills/write-post/VERSION)"
      - name: install (project, claude) and checks
        run: |
          export WRITE_POST_REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          mkdir -p /tmp/proj && cd /tmp/proj
          bash "$GITHUB_WORKSPACE/install_mac.sh" " Claude " Project </dev/null
          test -f .claude/skills/write-post/SKILL.md
          [ "$(find .claude/skills/write-post -type f | wc -l)" -eq 28 ]
          bash "$GITHUB_WORKSPACE/install_mac.sh" claude,codex project </dev/null
          node -e "const j=JSON.parse(require('fs').readFileSync('.claude/skills/write-post/install.json','utf8')); if(j.tools.length!==2) throw new Error('tools '+JSON.stringify(j.tools)); console.log('install.json ok', j.tools)"
          echo keep > .claude/skills/write-post/my-note.md
          bash "$GITHUB_WORKSPACE/install_mac.sh" claude project </dev/null
          test -f .claude/skills/write-post/my-note.md
          if bash "$GITHUB_WORKSPACE/install_mac.sh" claude,banana project </dev/null; then echo "banana를 거르지 못함"; exit 1; fi
          node .claude/skills/write-post/scripts/find-tags.mjs "24기" | head -c 200
          echo; echo OK
