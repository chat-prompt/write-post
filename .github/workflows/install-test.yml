  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install (project, claude) and checks
        run: |
          export WRITE_POST_REPO_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          mkdir -p /tmp/proj && cd /tmp/proj
          bash "$GITHUB_WORKSPACE/install_mac.sh" " Claude " Project </dev/null
          test -f .claude/skills/write-post/SKILL.md
          [ "$(find .claude/skills/write-post -type f | wc -l)" -eq 20 ]
          echo keep > .claude/skills/write-post/my-note.md
          bash "$GITHUB_WORKSPACE/install_mac.sh" claude project </dev/null
          test -f .claude/skills/write-post/my-note.md
          if bash "$GITHUB_WORKSPACE/install_mac.sh" claude,banana project </dev/null; then echo "banana를 거르지 못함"; exit 1; fi
          node .claude/skills/write-post/scripts/find-tags.mjs "24기" | head -c 200
          echo; echo OK
