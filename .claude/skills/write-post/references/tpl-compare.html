<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="_diagram.css">
<style>
  .stage { width:auto; } .wrap { display:flex; flex-direction:column; gap:20px; width:540px; }
  .col { border-radius:22px; padding:26px 28px; display:flex; align-items:center; gap:22px; }
  .low { background:var(--rose-bg); border:3px solid #f1cdd4; } .top { background:var(--sage-bg); border:3px solid #cfe3c9; }
  .big { font-size:88px; font-weight:900; line-height:1; } .low .big { color:var(--rose-d); } .top .big { color:var(--sage-d); }
  .lab { font-size:30px; font-weight:800; line-height:1.3; } .lab small { display:block; font-size:22px; font-weight:600; color:var(--mut); margin-top:6px; }
  .foot { text-align:center; font-size:30px; font-weight:800; color:#6b5b4a; margin-top:4px; }
</style></head><body><div class="stage"><div class="wrap">
  <div class="col low"><div class="big">40분</div><div class="lab">손으로 정리할 때<small>세금계산서 한 달 치</small></div></div>
  <div class="col top"><div class="big">3분</div><div class="lab">클로드 코드로 정리<small>같은 한 달 치</small></div></div>
  <div class="foot">순서만 바꿨는데 이만큼 줄었다</div>
</div></div></body></html>
