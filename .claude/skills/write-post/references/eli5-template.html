<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#faf6ef;color:#3b2f24;}
 .wrap{max-width:720px;margin:0 auto;padding:28px 18px;}
 h1{font-size:34px;margin:0 0 6px;} .sub{font-size:20px;color:#8a7a68;margin-bottom:26px;}
 section{background:#fff;border-radius:18px;padding:22px 18px;margin-bottom:18px;box-shadow:0 6px 18px rgba(80,60,40,.08);}
 .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;}
 .box{border-radius:14px;padding:16px 18px;font-size:24px;font-weight:800;text-align:center;min-width:120px;}
 .you{background:#ffe9d6;color:#b25a1f;} .skill{background:#e6f1e2;color:#3d6b45;} .ai{background:#e8e9f7;color:#4a4f9a;}
 .arrow{font-size:34px;color:#c9b8a5;} p{font-size:22px;line-height:1.5;margin:14px 0 0;}
 .stack{display:flex;flex-direction:column;gap:8px;align-items:center;}
 .card{width:100%;max-width:340px;border:3px solid #cfe3c9;border-radius:12px;padding:10px 14px;font-size:22px;background:#f4faf2;}
 .card.gray{border-color:#e4dcd2;background:#f6f3ee;color:#a39484;}
@media (max-width:600px){ .row{flex-direction:column;gap:6px;} .arrow{transform:rotate(90deg);line-height:1;} .box{min-width:200px;} }
</style></head><body><div class="wrap">
 <h1>클로드 코드 스킬이 뭔가요?</h1><div class="sub">5살도 이해하는 한 장</div>
 <section><div class="row"><div class="box you">나</div><div class="arrow">→</div><div class="box skill">스킬 = 할 일 설명서</div><div class="arrow">→</div><div class="box ai">클로드</div></div>
 <p>스킬은 "이럴 땐 이렇게 해"라고 적어 둔 설명서예요. 클로드가 일 시작 전에 읽어요.</p></section>
 <section><div class="stack"><div class="card">📄 글쓰기 스킬</div><div class="card">📄 이미지 스킬</div><div class="card gray">📄 안 쓰는 스킬 61개</div></div>
 <p>설명서는 많을수록 좋을까요? 아니요. 목록만 읽어도 매번 값을 내요.</p></section>
 <section><div class="row"><div class="box you">81개</div><div class="arrow">→</div><div class="box skill">20개</div></div>
 <p>그래서 안 쓰는 건 지웠어요. 그런데 토큰은 5,300 그대로였어요. 이유는 본문에서.</p></section>
</div></body></html>
